<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101111">
  <title>{% if page_title == site_title %}{{ site_title }} | {{ site_desc }}{% else %}{{ page_title }} | {{ site_title }}{% endif %}</title>
  <meta name="description" content="{{ description|default(site_desc) }}">
  <link rel="canonical" href="{{ canonical }}">
  <link rel="icon" type="image/jpeg" href="{{ avatar }}">
  <meta property="og:type" content="{% if post is defined %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ description|default(site_desc) }}">
  <meta property="og:image" content="{{ base_url }}{{ post.cover if post is defined and post.cover else hero }}">
  <meta property="og:url" content="{{ canonical }}">
  <link rel="stylesheet" href="/style.css">
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/">{{ site_title }}</a>
    <button class="menu-toggle" type="button" aria-label="展开导航" aria-expanded="false" aria-controls="site-nav">☰</button>
    <nav class="site-nav" id="site-nav" aria-label="主导航">
      <a href="/search/">搜索</a>
      <a href="/archive/">归档</a>
      <a href="/category/">分类</a>
      <a href="/tag/">标签</a>
      <a href="/about/">关于</a>
      <a href="{{ github }}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </nav>
  </header>
  {% block content %}{% endblock %}
  <footer class="footer">
    <span>© {{ site_title }} · {{ site_desc }}</span>
    <span><a href="/archive/">文章归档</a> · <a href="{{ github }}" target="_blank" rel="noopener noreferrer">GitHub</a></span>
  </footer>
  <script src="/site.js" defer></script>
</body>
</html>

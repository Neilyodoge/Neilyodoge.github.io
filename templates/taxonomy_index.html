{% extends "base.html" %}
{% block content %}
<main class="shell inner-shell">
  <section class="panel main-column taxonomy-panel">
    <div class="page-heading"><span class="eyebrow">EXPLORE</span><h1>{{ page_title }}</h1><p>按{% if kind == 'category' %}主题{% else %}关键词{% endif %}浏览文章。</p></div>
    <div class="taxonomy-grid">
      {% for name, subset in items.items() %}<a href="/{{ kind }}/{{ name|urlencode }}/"><strong>{{ name }}</strong><span>{{ subset|length }} 篇文章 →</span></a>{% endfor %}
    </div>
  </section>
  {% include "_sidebar.html" %}
</main>
{% endblock %}
